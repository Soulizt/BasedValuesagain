<body>
<script type="application/javascript"
        src="questions.js">
</script>
<h1>BAZEDValues</h1>
<hr>
<h2 style="text-align:center;" id="question-number">Loading...</h2>
<p class="question" id="question-text"></p>
<button class="button stronglyAgree" onclick="next_question( 1.0)">Strongly Agree</button> <br>
<button class="button agree" onclick="next_question( 0.5)">Agree</button> <br>
<button class="button neutral" onclick="next_question( 0.0)">Neutral/Unsure</button> <br>
<button class="button disagree" onclick="next_question(-0.5)">Disagree</button> <br>
<button class="button stronglyDisagree" onclick="next_question(-1.0)">Strongly Disagree</button> <br>
<button class="small_button" onclick="prev_question()" id="back_button">Back</button>
<button class="small_button_off" id="back_button_off">Back</button><br>

<!-- Website visit statistics - no personal information is collected! -->
<script type="text/javascript">
var sc_project=11325211;
var sc_invisible=1;
var sc_security="fd9f0659";

"https://secure." : "http://www.");
document.write("<sc"+"ript type='text/javascript' src='" +

class="statcounter"

stats"></a></div></noscript>

<!-- JavaScript for the test itself -->
<script>
    var max_econ, max_prop, max_scty, max_cult, max_agrs, max_ethi, max_mark, max_tech, max_dmoc, max_ntur, max_hier, max_radc; // Max possible scores
    max_econ = max_prop = max_scty = max_cult = max_agrs = max_ethi = max_mark = max_tech = max_dmoc = max_ntur = max_hier = max_radc = 0;
    let econ_array = new Array(questions.length);
    let prop_array = new Array(questions.length);
    let scty_array = new Array(questions.length);
    let cult_array = new Array(questions.length);
    let agrs_array = new Array(questions.length);
    let ethi_array = new Array(questions.length);
    let mark_array = new Array(questions.length);
    let tech_array = new Array(questions.length);
    let dmoc_array = new Array(questions.length);
    let ntur_array = new Array(questions.length);
    let hier_array = new Array(questions.length);
    let radc_array = new Array(questions.length);
    var qn = 0; // Question number
    init_question();
    for (var i = 0; i < questions.length; i++) {
        max_econ += Math.abs(questions[i].effect.econ)
        max_prop += Math.abs(questions[i].effect.prop)
        max_scty += Math.abs(questions[i].effect.scty)
        max_cult += Math.abs(questions[i].effect.cult)
        max_agrs += Math.abs(questions[i].effect.agrs)
        max_ethi += Math.abs(questions[i].effect.ethi)
        max_mark += Math.abs(questions[i].effect.mark)
        max_tech += Math.abs(questions[i].effect.tech)
        max_dmoc += Math.abs(questions[i].effect.dmoc)
        max_ntur += Math.abs(questions[i].effect.ntur)
        max_hier += Math.abs(questions[i].effect.hier)
        max_radc += Math.abs(questions[i].effect.radc)
    }
    function init_question() {
        document.getElementById("question-text").innerHTML = questions[qn].question;
        document.getElementById("question-number").innerHTML = "Question " + (qn + 1) + " of " + (questions.length);
        if (qn == 0) {
            document.getElementById("back_button").style.display = 'none';
            document.getElementById("back_button_off").style.display = 'block';
        } else {
            document.getElementById("back_button").style.display = 'block';
            document.getElementById("back_button_off").style.display = 'none';
        }

    }

    function next_question(mult) {
        econ_array[qn] = mult*questions[qn].effect.econ
        prop_array[qn] = mult*questions[qn].effect.prop
        scty_array[qn] = mult*questions[qn].effect.scty
        cult_array[qn] = mult*questions[qn].effect.cult
        agrs_array[qn] = mult*questions[qn].effect.agrs
        ethi_array[qn] = mult*questions[qn].effect.ethi
        mark_array[qn] = mult*questions[qn].effect.mark
        tech_array[qn] = mult*questions[qn].effect.tech
        dmoc_array[qn] = mult*questions[qn].effect.dmoc
        ntur_array[qn] = mult*questions[qn].effect.ntur
        hier_array[qn] = mult*questions[qn].effect.hier
        radc_array[qn] = mult*questions[qn].effect.radc
        qn++;
        if (qn < questions.length) {
            init_question();
        } else {
            results();
        }
    }

    function prev_question() {
        if (qn == 0) {
            return;
        }
        qn--;
        init_question();
    }

    function calc_score(score,max) {
        return (100*(max+score)/(2*max)).toFixed(1)
    }

    function results() {
        let final_econ = econ_array.reduce((a, b) => a + b, 0)
        let final_prop = prop_array.reduce((a, b) => a + b, 0)
        let final_scty = scty_array.reduce((a, b) => a + b, 0)
        let final_cult = cult_array.reduce((a, b) => a + b, 0)
        let final_agrs = agrs_array.reduce((a, b) => a + b, 0)
        let final_ethi = ethi_array.reduce((a, b) => a + b, 0)
        let final_mark = mark_array.reduce((a, b) => a + b, 0)
        let final_tech = tech_array.reduce((a, b) => a + b, 0)
        let final_dmoc = dmoc_array.reduce((a, b) => a + b, 0)
        let final_ntur = ntur_array.reduce((a, b) => a + b, 0)
        let final_hier = hier_array.reduce((a, b) => a + b, 0)
        let final_radc = radc_array.reduce((a, b) => a + b, 0)
        location.href = `results.html`
            + `?e=${calc_score(final_econ,max_econ)}`
            + `&p=${calc_score(final_prop,max_prop)}`
            + `&s=${calc_score(final_scty,max_scty)}`
            + `&c=${calc_score(final_cult,max_cult)}`
            + `&a=${calc_score(final_agrs,max_agrs)}`
            + `&h=${calc_score(final_ethi,max_ethi)}`
            + `&m=${calc_score(final_mark,max_mark)}`
            + `&t=${calc_score(final_tech,max_tech)}`
            + `&d=${calc_score(final_dmoc,max_dmoc)}`
            + `&n=${calc_score(final_ntur,max_ntur)}`
            + `&i=${calc_score(final_hier,max_hier)}`
            + `&r=${calc_score(final_radc,max_radc)}`
    }
</script>
</body>
